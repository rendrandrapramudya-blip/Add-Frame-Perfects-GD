name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          target: win
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-geode
          path: "**/*.geode"

  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          target: android64
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: android64-geode
          path: "**/*.geode"
